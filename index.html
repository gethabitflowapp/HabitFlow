
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitFlow</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: #B56BFF;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    .header {
      position: absolute;
      top: 110px;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 14px;
      color: #B56BFF;
    }

    p {
      font-size: 18px;
      color: #B56BFF;
    }

    .download-btn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: inline-block;
      background: #ff35b8;
      color: #050505;
      text-decoration: none;
      padding: 18px 42px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .download-btn:hover {
      background: #ff70cc;
      transform: translate(-50%, -50%) scale(1.05);
    }

    @media (max-width: 600px) {
      .header {
        top: 80px;
      }

      h1 {
        font-size: 38px;
      }

      p {
        font-size: 16px;
      }

      .download-btn {
        font-size: 18px;
        padding: 16px 34px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>HabitFlow</h1>
    <p>Track your habits. Build your future.</p>
  </div>

  <a
    class="download-btn"
    href="https://sigmakingcmd.github.io/HabitFlow/"
    target="_blank"
    rel="noopener noreferrer"
  >
    Download here
  </a>

</body>
</html>
