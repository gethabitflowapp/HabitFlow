
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HabitFlow</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #050505;
  color: #B56BFF;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

.header {
  position: absolute;
  top: 110px;
  width: 100%;
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 48px;
  margin-bottom: 14px;
}

p {
  font-size: 18px;
}

.download-btn {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #ff35b8;
  color: #050505;
  padding: 18px 42px;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}

.download-btn:hover {
  background: #ff70cc;
}

@media (max-width: 600px) {
  h1 { font-size: 38px; }
  p { font-size: 16px; }
}
</style>
</head>

<body>

<div class="header">
  <h1>HabitFlow</h1>
  <p>Track your habits. Build your future.</p>
</div>

<button
  class="download-btn"
  type="button"
  onclick="window.location.href='https://gethabitflowapp.github.io/HabitFlow/'">
  Download here
</button>

</body>
</html>
